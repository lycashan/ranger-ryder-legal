<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billy Ryder's Reinvention Lab 360</title>
<style>
  html,body{margin:0;height:100%;background:#120c08;color:#f3e2c0;font-family:sans-serif;overflow:hidden}
  #view{position:fixed;inset:0}
  #bar{position:fixed;top:0;left:0;right:0;text-align:center;padding:16px;background:linear-gradient(#120c08ee,#120c0800);z-index:2}
  h1{font-size:26px;margin:0 0 12px}
  .btn{display:inline-block;background:#c9a24a;color:#120c08;font-size:40px;font-weight:bold;padding:24px 70px;border-radius:16px;text-decoration:none;border:none;cursor:pointer;margin:6px}
  .small{font-size:20px;padding:12px 30px;background:#5a4422;color:#f3e2c0}
  #msg{font-size:22px;margin-top:10px;min-height:28px}
</style>
</head>
<body>
<div id="view"></div>
<div id="bar">
  <h1>Billy Ryder's Reinvention Lab</h1>
  <button id="enter" class="btn">ENTER LAB</button><br>
  <a class="btn small" href="Reinvention_Lab_360.jpg" download="Reinvention_Lab_360.jpg">Save picture</a>
  <div id="msg"></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const msg = document.getElementById('msg');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.getElementById('view').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 0);

const geo = new THREE.SphereGeometry(50, 96, 64);
geo.scale(-1, 1, 1); // see the picture from inside
const tex = new THREE.TextureLoader().load('Reinvention_Lab_360.jpg', () => { window.labLoaded = true; });
tex.colorSpace = THREE.SRGBColorSpace;
const sphere = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map:tex}));
sphere.position.set(0, 1.6, 0);
sphere.rotation.y = -Math.PI/2; // sign in front of you
scene.add(sphere);

// look around with mouse or finger (outside the headset)
let lon = -90, lat = 0, down = false, sx = 0, sy = 0, slon = 0, slat = 0;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { down = true; sx = e.clientX; sy = e.clientY; slon = lon; slat = lat; });
addEventListener('pointerup', () => down = false);
addEventListener('pointermove', e => {
  if (!down) return;
  lon = slon - (e.clientX - sx) * 0.15;
  lat = Math.max(-80, Math.min(80, slat + (e.clientY - sy) * 0.15));
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const bar = document.getElementById('bar');
document.getElementById('enter').addEventListener('click', async () => {
  if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-vr'))) {
    msg.textContent = 'Open this page in the headset Browser to step inside.';
    return;
  }
  try {
    const session = await navigator.xr.requestSession('immersive-vr', {optionalFeatures:['local-floor']});
    await renderer.xr.setSession(session);
    bar.style.display = 'none';
    session.addEventListener('end', () => { bar.style.display = ''; });
  } catch (err) {
    msg.textContent = 'Could not enter: ' + err.message;
  }
});

renderer.setAnimationLoop(() => {
  if (!renderer.xr.isPresenting) {
    const phi = THREE.MathUtils.degToRad(90 - lat), th = THREE.MathUtils.degToRad(lon);
    camera.lookAt(camera.position.x + Math.sin(phi)*Math.cos(th),
                  camera.position.y + Math.cos(phi),
                  camera.position.z + Math.sin(phi)*Math.sin(th));
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
