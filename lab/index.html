<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billy Ryder's Reinvention Lab 360</title>
<style>
  html,body{margin:0;height:100%;background:#120c08;color:#f3e2c0;font-family:sans-serif;overflow:hidden}
  #view{position:fixed;inset:0}
  #bar{position:fixed;top:0;left:0;right:0;text-align:center;padding:16px;background:linear-gradient(#120c08ee,#120c0800);z-index:2}
  h1{font-size:26px;margin:0 0 12px}
  .btn{display:inline-block;background:#c9a24a;color:#120c08;font-size:40px;font-weight:bold;padding:24px 70px;border-radius:16px;text-decoration:none;border:none;cursor:pointer;margin:6px}
  .small{font-size:20px;padding:12px 30px;background:#5a4422;color:#f3e2c0}
  .rm.on{background:#c9a24a;color:#120c08}
  .sz.on{background:#c9a24a;color:#120c08}
  #msg{font-size:22px;margin-top:10px;min-height:28px}
</style>
</head>
<body>
<div id="view"></div>
<div id="bar">
  <h1>Billy Ryder's Reinvention Lab</h1>
  <button id="enter" class="btn">ENTER LAB</button><br><div style="margin:6px">Room: <button class="btn small rm" data-r="studio">Studio</button><button class="btn small rm" data-r="lab">Big Lab</button></div><div id="sizes" style="margin:6px">Room size: <button class="btn small sz" data-s="cozy">Cozy</button><button class="btn small sz" data-s="medium">Medium</button><button class="btn small sz" data-s="large">Large</button></div><div style="font-size:22px;margin:4px">To leave the lab: pinch once (or pull the trigger).</div>
  <a class="btn small" href="Reinvention_Lab2_360_sharp.jpg" download="Reinvention_Lab2_360_sharp.jpg">Save picture</a>
  <div id="msg"></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const msg = document.getElementById('msg');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.getElementById('view').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 1.6, 0);

// Shape the picture like a real room: floor at your real standing height, walls and ceiling at the chosen room size.
const EYE = 1.6;
const SIZES = { cozy: [1.8, 0.9], medium: [2.4, 1.2], large: [3.0, 1.4] }; // [wall distance, ceiling above eyes] in meters
function roomGeometry(size) {
  const [WALL, CEIL] = SIZES[size];
  const g = new THREE.SphereGeometry(1, 192, 128);
  const pos = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    let d = WALL;
    if (v.y < -1e-4) d = Math.min(d, EYE / -v.y);
    if (v.y > 1e-4) d = Math.min(d, CEIL / v.y);
    v.multiplyScalar(d);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeBoundingSphere();
  g.scale(-1, 1, 1); // see the picture from inside
  return g;
}
let size = 'cozy';
try { size = localStorage.getItem('labSize') || 'cozy'; } catch (e) {}
if (!SIZES[size]) size = 'cozy';
const geo = roomGeometry(size);
const ROOMS = { studio: 'Virtual_Creativity_Studio_360_sharp.jpg', lab: 'Reinvention_Lab2_360_sharp.jpg' };
let room = 'studio';
try { room = localStorage.getItem('labRoom') || 'studio'; } catch (e) {}
if (!ROOMS[room]) room = 'studio';
const loader = new THREE.TextureLoader();
const tex = loader.load(ROOMS[room], () => { window.labLoaded = true; });
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const sphere = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map:tex}));
sphere.position.set(0, 1.6, 0);
sphere.rotation.y = -Math.PI/2; // sign in front of you
scene.add(sphere);

function showSize() { document.querySelectorAll('.sz').forEach(b => b.classList.toggle('on', b.dataset.s === size)); }
document.querySelectorAll('.sz').forEach(b => b.addEventListener('click', () => {
  size = b.dataset.s;
  try { localStorage.setItem('labSize', size); } catch (e) {}
  sphere.geometry.dispose(); sphere.geometry = roomGeometry(size); showSize();
}));
showSize();
function showRoom() { document.querySelectorAll('.rm').forEach(b => b.classList.toggle('on', b.dataset.r === room)); }
document.querySelectorAll('.rm').forEach(b => b.addEventListener('click', () => {
  room = b.dataset.r;
  try { localStorage.setItem('labRoom', room); } catch (e) {}
  loader.load(ROOMS[room], t => {
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const old = sphere.material.map; sphere.material.map = t; sphere.material.needsUpdate = true; old.dispose();
  });
  showRoom();
}));
showRoom();

// look around with mouse or finger (outside the headset)
let lon = -90, lat = 0, down = false, sx = 0, sy = 0, slon = 0, slat = 0;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { down = true; sx = e.clientX; sy = e.clientY; slon = lon; slat = lat; });
addEventListener('pointerup', () => down = false);
addEventListener('pointermove', e => {
  if (!down) return;
  lon = slon - (e.clientX - sx) * 0.15;
  lat = Math.max(-80, Math.min(80, slat + (e.clientY - sy) * 0.15));
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const bar = document.getElementById('bar');
document.getElementById('enter').addEventListener('click', async () => {
  if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-vr'))) {
    msg.textContent = 'Open this page in the headset Browser to step inside.';
    return;
  }
  try {
    const session = await navigator.xr.requestSession('immersive-vr', {optionalFeatures:['local-floor']});
    await renderer.xr.setSession(session);
    bar.style.display = 'none';
    session.addEventListener('end', () => { bar.style.display = ''; });
    // one pinch or trigger pull = leave the lab
    session.addEventListener('select', () => session.end());
  } catch (err) {
    msg.textContent = 'Could not enter: ' + err.message;
  }
});

renderer.setAnimationLoop(() => {
  if (!renderer.xr.isPresenting) {
    const phi = THREE.MathUtils.degToRad(90 - lat), th = THREE.MathUtils.degToRad(lon);
    camera.lookAt(camera.position.x + Math.sin(phi)*Math.cos(th),
                  camera.position.y + Math.cos(phi),
                  camera.position.z + Math.sin(phi)*Math.sin(th));
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
